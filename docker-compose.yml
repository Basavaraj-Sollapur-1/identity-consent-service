services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: echolife_identity
      POSTGRES_USER: echolife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echolife -d echolife_identity"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.10-alpine
    ports: ["6379:6379"]
